; ============================================================
; platformio.ini
; PlatformIO project configuration untuk ECU Dashboard
; ============================================================
; Gunakan PlatformIO (VS Code extension) untuk build yang
; lebih mudah dan dependency management otomatis
; ============================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Upload settings
upload_speed = 921600
monitor_speed = 115200

; Board specific
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi

; Partisi untuk lebih banyak program space
board_build.partitions = huge_app.csv

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI configuration
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=480
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_MISO=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DTFT_BGR_ORDER

; Library dependencies
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.34
    paulstoffregen/XPT2046_Touchscreen @ ^1.4.0
    bblanchon/ArduinoJson @ ^7.0.0
    SPI
    Wire

; Monitor filters
monitor_filters =
    esp32_exception_decoder
    time
