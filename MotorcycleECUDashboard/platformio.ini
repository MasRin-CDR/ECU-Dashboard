[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

lib_deps =
    TFT_eSPI
    LVGL
    XPT2046_Touchscreen
    ArduinoJson

build_flags =
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D KLINE_RX=16
    -D KLINE_TX=17
    -D TOUCH_CS=15
    -D TOUCH_IRQ=27

upload_speed = 921600

; Additional settings for debugging
debug_tool = esp32
debug_init_break = tbreak setup

; Watchdog timer settings
build_flags += -D WATCHDOG_TIMER_ENABLED
